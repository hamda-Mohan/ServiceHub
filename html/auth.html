<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Form</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>

<body>
    <div class="container-auth">
        <h1 id="form-title">Sign In</h1>
        <form class="auth-form">
            <input type="text" placeholder="Username" id="username" name="username" style="display: none;">
            <input type="email" placeholder="email" id="email" name="email" required>
            <input type="password" placeholder="Password" id="password" name="password" required>
            <input type="password" placeholder="Confirm Password" id="confirmPassword" name="confirmPassword"
                style="display: none;">
            <button type="submit" class="btn">Login</button>
            <p id="auth-message">Don't have an account? <a href="#" id="auth-form-link">Sign up</a></p>
        </form>
    </div>
    <script src="../js/auth.js"></script>
</body>

</html>
